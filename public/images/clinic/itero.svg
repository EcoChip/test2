<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE4"/>
      <stop offset="100%" stop-color="#E2DBD0"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4C42" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2F4C42" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#wallGrad)"/>

  <!-- Large architectural windows -->
  <rect x="80" y="60" width="400" height="420" fill="url(#glassGrad)" stroke="#1D2420" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="280" y1="60" x2="280" y2="480" stroke="#1D2420" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="80" y1="270" x2="480" y2="270" stroke="#1D2420" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Modern dental chair minimalist silhouette -->
  <g transform="translate(560, 220)">
    <!-- Base -->
    <ellipse cx="140" cy="270" rx="90" ry="25" fill="#1D2420" opacity="0.8"/>
    <rect x="125" y="160" width="30" height="110" rx="6" fill="#2F4C42"/>
    <!-- Seat & Backrest -->
    <rect x="30" y="140" width="220" height="35" rx="10" fill="#FAF7F2" stroke="#2F4C42" stroke-width="3"/>
    <path d="M 60 140 L 0 50 L 50 40 L 95 140 Z" fill="#FAF7F2" stroke="#2F4C42" stroke-width="3"/>
    <!-- Headrest -->
    <ellipse cx="20" cy="30" rx="28" ry="18" fill="#FAF7F2" stroke="#2F4C42" stroke-width="2"/>
  </g>

  <!-- Flooring line -->
  <line x1="0" y1="490" x2="1000" y2="490" stroke="#1D2420" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="0" y="490" width="1000" height="160" fill="#FAF7F2" opacity="0.6"/>

  <!-- Caption overlay -->
  <rect x="60" y="530" width="450" height="70" rx="4" fill="#1D2420" opacity="0.85"/>
  <text x="85" y="560" font-family="serif" font-size="18" fill="#FAF7F2">Gabinete de Diagnóstico Digital 3D</text>
  <text x="85" y="582" font-family="sans-serif" font-size="11" fill="#E1785A" letter-spacing="1">BARRIO DE SALAMANCA, MADRID</text>
</svg>