<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2E26" />
      <stop offset="100%" stop-color="#0E1411" />
    </radialGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#F7F5EE"/>
      <stop offset="100%" stop-color="#D1C9B7"/>
    </linearGradient>
    <linearGradient id="gingivaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E08F87"/>
      <stop offset="100%" stop-color="#9C4D46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGlow)" />
  
  <!-- Subtle clinical grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
  </g>
  
  <!-- Gingival arch background -->
  <path d="M 120 180 C 260 120, 540 120, 680 180 C 670 210, 650 220, 600 210 C 530 200, 470 190, 400 190 C 330 190, 270 200, 200 210 C 150 220, 130 210, 120 180 Z" fill="url(#gingivaGrad)" opacity="0.85"/>
  
  <!-- Teeth group -->
  <g id="teeth" transform="translate(0, 10)">
    
  <!-- Closed central contact -->
  <rect x="401" y="165" width="60" height="115" rx="14" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="339" y="165" width="60" height="115" rx="14" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="469" y="175" width="50" height="102" rx="12" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="281" y="175" width="50" height="102" rx="12" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="527" y="188" width="45" height="105" rx="10" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="228" y="188" width="45" height="105" rx="10" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="580" y="200" width="40" height="92" rx="8" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>
  <rect x="180" y="200" width="40" height="92" rx="8" fill="url(#toothGrad)" stroke="#D6CEBE" stroke-width="1.5"/>

  </g>
  
  <!-- Clinical annotations -->
  <text x="40" y="50" font-family="sans-serif" font-size="12" fill="#FAF7F2" opacity="0.6" letter-spacing="2">AURA CLINICAL CASE ARCHIVE</text>
  <text x="40" y="75" font-family="serif" font-size="18" fill="#FAF7F2" font-weight="bold">Alineación & Cierre de Tronera</text>
  <text x="40" y="465" font-family="sans-serif" font-size="11" fill="#FAF7F2" opacity="0.45">Resultado a los 9 meses con retenedores Vivera</text>
  <circle cx="750" cy="50" r="4" fill="#2F4C42"/>
</svg>