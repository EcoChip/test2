<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2E26" />
      <stop offset="100%" stop-color="#0E1411" />
    </radialGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E2DCce"/>
      <stop offset="100%" stop-color="#B8AE99"/>
    </linearGradient>
    <linearGradient id="gingivaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7770"/>
      <stop offset="100%" stop-color="#9C4D46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGlow)" />
  
  <!-- Subtle clinical grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
  </g>
  
  <!-- Gingival arch background -->
  <path d="M 120 180 C 260 120, 540 120, 680 180 C 670 210, 650 220, 600 210 C 530 200, 470 190, 400 190 C 330 190, 270 200, 200 210 C 150 220, 130 210, 120 180 Z" fill="url(#gingivaGrad)" opacity="0.85"/>
  
  <!-- Teeth group -->
  <g id="teeth" transform="translate(0, 10)">
    
  <rect x="402" y="180" width="58" height="90" rx="6" fill="#D3C9B2" stroke="#A89E88" stroke-width="1.5"/>
  <rect x="340" y="180" width="58" height="92" rx="6" fill="#D0C6AF" stroke="#A89E88" stroke-width="1.5"/>
  <rect x="468" y="188" width="48" height="85" rx="6" fill="#D3C9B2" stroke="#A89E88" stroke-width="1.5"/>
  <rect x="284" y="188" width="48" height="84" rx="6" fill="#D0C6AF" stroke="#A89E88" stroke-width="1.5"/>
  <rect x="524" y="196" width="44" height="92" rx="6" fill="#C9BFAB" stroke="#A89E88" stroke-width="1.5"/>
  <rect x="232" y="196" width="44" height="94" rx="6" fill="#C9BFAB" stroke="#A89E88" stroke-width="1.5"/>

  </g>
  
  <!-- Clinical annotations -->
  <text x="40" y="50" font-family="sans-serif" font-size="12" fill="#FAF7F2" opacity="0.6" letter-spacing="2">AURA CLINICAL CASE ARCHIVE</text>
  <text x="40" y="75" font-family="serif" font-size="18" fill="#FAF7F2" font-weight="bold">Desgaste Incisal & Hipoplasia</text>
  <text x="40" y="465" font-family="sans-serif" font-size="11" fill="#FAF7F2" opacity="0.45">Pérdida de longitud coronal por bruxismo severo</text>
  <circle cx="750" cy="50" r="4" fill="#E1785A"/>
</svg>